services:
  - type: web
    name: zistino-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn zistino_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GUNICORN_TIMEOUT
        value: 120
      - key: GUNICORN_WORKERS
        value: 1
      - key: GUNICORN_THREADS
        value: 2

